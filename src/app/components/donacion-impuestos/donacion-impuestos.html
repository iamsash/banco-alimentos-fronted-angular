<section id="donacion-impuestos" class="seccion moderna">

  <div class="contenido">

    <div class="donacion-impuestos-box">

      <div class="donacion-impuestos-title">
        <h2>Donación por Impuestos</h2>
      </div>

      <div class="donacion-impuestos-info">

        <p>
          Ayúdanos a sostener nuestra labor DONANDO PARTE DE TU IMPUESTO A LA RENTA.
          Con tu apoyo, podemos seguir llevando alimentos y esperanza a quienes más lo necesitan.
        </p>

        <div class="donacion-impuestos-beneficios">

          <h3>Beneficios de Donar</h3>

          <ul>
            <li *ngFor="let beneficio of beneficios">
              {{ beneficio }}
            </li>
          </ul>

        </div>

        <div class="donacion-impuestos-cta">
          <button class="btn-donar">
            ¡Dona Ahora!
          </button>
        </div>

      </div>

    </div>

  </div>

</section>
