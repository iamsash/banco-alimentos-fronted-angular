<div class="panel-card">

  <h2>Registrar Donación</h2>

  <form class="formulario-panel" (ngSubmit)="guardarDonacion()">

    <div class="campo">

      <label>Donador</label>

      <select
        [(ngModel)]="donacion.usuario.id"
        name="usuario">

        <option [value]="0">Seleccione un donador</option>

        <option
          *ngFor="let usuario of usuarios()"
          [value]="usuario.id">

          {{ usuario.nombre }}

        </option>

      </select>

    </div>

    <div class="campo">

      <label>Alimento</label>

      <select
        [(ngModel)]="donacion.alimento.id"
        name="alimento">

        <option [value]="0">Seleccione un alimento</option>

        <option
          *ngFor="let alimento of alimentos()"
          [value]="alimento.id">

          {{ alimento.nombre }}

        </option>

      </select>

    </div>

    <div class="campo">

      <label>Cantidad</label>

      <input
        type="number"
        [(ngModel)]="donacion.cantidad"
        name="cantidad">

    </div>

    <div class="campo">

      <label>Fecha</label>

      <input
        type="date"
        [(ngModel)]="donacion.fecha"
        name="fecha">

    </div>

    <button type="submit">

      Registrar Donación

    </button>

  </form>

  <hr>

  <h3>Listado de Donaciones</h3>

  <div
  style="
    display:flex;
    gap:15px;
    align-items:end;
    margin:20px 0;
    flex-wrap:wrap;">

    <div class="campo">

        <label>Buscar</label>

        <input
            type="text"
            [(ngModel)]="textoBusqueda"
            placeholder="🔍 Donador o alimento">

    </div>

    <div class="campo">

        <label>Desde</label>

        <input
            type="date"
            [(ngModel)]="fechaDesde">

    </div>

    <div class="campo">

        <label>Hasta</label>

        <input
            type="date"
            [(ngModel)]="fechaHasta">

    </div>

    <button
        type="button"
        (click)="textoBusqueda='';fechaDesde='';fechaHasta=''">

        Limpiar

    </button>

</div>

  <table class="tabla-panel">

    <thead>

      <tr>

      
        <th>Donador</th>
        <th>Alimento</th>
        <th>Cantidad</th>
        <th>Fecha</th>

      </tr>

    </thead>

    <tbody>

  <tr *ngFor="let donacion of donacionesFiltradas">

      

    <td>{{ donacion.usuarioNombre }}</td>

<td>{{ donacion.alimentoNombre }}</td>

        <td>{{ donacion.cantidad }}</td>

        <td>{{ donacion.fecha }}</td>

      </tr>

    </tbody>

  </table>

</div>
